name: testing

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Integration Tests (Cobbler ${{ matrix.cobbler_version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cobbler_version:
          - v4.0.0b11
      fail-fast: false
    steps:
      - name: Check out code into the Go module directory
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        # https://github.com/actions/setup-go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'
        id: go
      - name: Install system dependencies
        run: |
          sudo apt-get install -y xorriso
      - name: Get dependencies
        run: |
          go mod download
      - name: Replace Cobbler image tag
        run: |
          sed -i "s/cobbler_image_tag=.*/cobbler_image_tag=${{ matrix.cobbler_version }}/" testing/start.sh
      - name: Restore OS ISO
        id: cache-iso-restore
        # https://github.com/actions/cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            *.iso
          key: ${{ runner.os }}-${{ matrix.cobbler_version }}-iso
      - name: Make Test
        run: |
          make test
      - name: Save OS ISO
        id: cache-iso-save
        # https://github.com/actions/cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            *.iso
          key: ${{ steps.cache-iso-restore.outputs.cache-primary-key }}
      - name: Upload coverage report to GH artifacts
        if: matrix.cobbler_version == 'v4.0.0b11'
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.out
          if-no-files-found: error
